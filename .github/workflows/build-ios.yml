name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    # تنظيف البناء القديم
    - name: تنظيف مجلد البناء القديم
      run: |
        rm -rf build
        rm -rf Payload
        rm -f Play.ipa

    # استنساخ الكود مع المكتبات الفرعية
    - name: استنساخ الكود مع المكتبات الفرعية
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # تثبيت الأدوات والمكتبات
    - name: تثبيت أدوات البناء والمكتبات الأساسية
      run: |
        brew update
        brew install cmake ninja pkg-config
        brew install sdl2 glew glm libpng zlib libogg libvorbis freetype
        brew install ffmpeg@6
        echo "✅ تم تثبيت جميع المكتبات"

    # تجهيز متغيرات البيئة
    - name: تجهيز متغيرات البيئة
      run: |
        echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/ffmpeg@6/lib/pkgconfig" >> $GITHUB_ENV
        echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=/opt/homebrew" >> $GITHUB_ENV

    # ======================================================
    # 🔥 حذف كل ما يتعلق بـ Qt قبل البناء (حل جذري)
    # ======================================================
    - name: تعطيل Qt نهائياً عن طريق حذف المجلدات والمراجع
      run: |
        # 1. حذف مجلدات Qt المتعلقة بالواجهة والأدوات
        rm -rf Source/ui_qt
        rm -rf tools

        # 2. حذف أي سطر يحتوي على "ui_qt" أو "QT_" من CMakeLists.txt
        sed -i '' '/ui_qt/d' CMakeLists.txt
        sed -i '' '/QT_/d' CMakeLists.txt
        sed -i '' '/add_subdirectory(tools)/d' CMakeLists.txt

        # 3. تأكيد الحذف (اختياري)
        echo "✅ تم حذف مجلدات ui_qt و tools وجميع مراجع Qt"

    # تجهيز البناء مع تعطيل Qt بكل الطرق الممكنة
    - name: تجهيز البناء (Configure)
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DIOS=ON \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
          -DCMAKE_PREFIX_PATH=/opt/homebrew \
          -DCMAKE_C_COMPILER=$(xcrun --sdk iphoneos --find clang) \
          -DCMAKE_CXX_COMPILER=$(xcrun --sdk iphoneos --find clang++) \
          -DUSE_QT=OFF \
          -DENABLE_QT=OFF \
          -DBUILD_QT_UI=OFF \
          -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=TRUE \
          -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE \
          -DBUILD_TOOLS=OFF \
          -DBUILD_TESTS=OFF \
          -DUSE_OPENGL=OFF \
          -DUSE_OPENGLES=ON \
          -DUSE_VULKAN=OFF \
          -DUSE_LIBUSB=OFF \
          -DUSE_BLUETOOTH=OFF \
          -DUSE_DISCORD_RPC=OFF \
          -DUSE_SDL2=ON \
          -DSDL2_INCLUDE_DIR=/opt/homebrew/include \
          -DSDL2_LIBRARY=/opt/homebrew/lib/libSDL2.dylib \
          -DOPENGL_INCLUDE_DIR=/opt/homebrew/include \
          -DFFMPEG_DIR=/opt/homebrew/opt/ffmpeg@6 \
          -DCMAKE_C_FLAGS="-arch arm64 -miphoneos-version-min=13.0" \
          -DCMAKE_CXX_FLAGS="-arch arm64 -miphoneos-version-min=13.0" \
          -DCMAKE_EXE_LINKER_FLAGS="-arch arm64 -miphoneos-version-min=13.0"
        echo "✅ تم تجهيز البناء"

    # البناء الفعلي
    - name: بدء البناء (قد يستغرق 20-30 دقيقة)
      run: |
        cd build
        ninja -j$(sysctl -n hw.ncpu)
        echo "✅ انتهى البناء"

    # البحث عن ملف .app
    - name: البحث عن ملف التطبيق .app
      run: |
        APP_PATH=$(find build -name "*.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "❌ لم يتم العثور على .app"
          find build -type d -name "*.app"
          exit 1
        fi
        echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
        echo "✅ تم العثور على التطبيق"

    # إنشاء Payload وضغطها
    - name: إنشاء مجلد Payload وضغطه
      run: |
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r Play.ipa Payload
        echo "✅ تم إنشاء Play.ipa"

    # رفع الـ IPA
    - name: رفع ملف IPA للتحميل
      uses: actions/upload-artifact@v4
      with:
        name: Play-iOS-IPA
        path: Play.ipa
        if-no-files-found: error
