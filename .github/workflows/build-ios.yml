name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      MIN_IOS_VERSION: "13.0"
      GLES_SILENCE_DEPRECATION: "1"

    steps:

      # ==========================================================
      # 1. تحميل المشروع
      # ==========================================================
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # ==========================================================
      # 2. تحديث Submodules
      # ==========================================================
      - name: Update Submodules
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "=== Submodules ==="
          git submodule status --recursive || true


      # ==========================================================
      # 3. تنظيف الملفات القديمة
      # ==========================================================
      - name: Clean Old Build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          rm -rf Payload
          rm -f Play.ipa

          echo "Clean completed"


      # ==========================================================
      # 4. فحص المشروع
      # ==========================================================
      - name: Check Project Files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Current Directory ==="
          pwd

          echo ""
          echo "=== Project Files ==="
          ls -la

          if [ ! -f "CMakeLists.txt" ]; then
            echo "ERROR: CMakeLists.txt not found"
            exit 1
          fi

          echo ""
          echo "CMakeLists.txt found"

          echo ""
          echo "=== All CMakeLists.txt Files ==="
          find . -name "CMakeLists.txt" -print


      # ==========================================================
      # 5. تثبيت أدوات البناء
      # ==========================================================
      - name: Install Build Tools
        shell: bash
        run: |
          set -euo pipefail

          brew update

          brew install cmake ninja pkg-config

          brew install \
            sdl2 \
            glew \
            glm \
            libpng \
            zlib \
            libogg \
            libvorbis \
            freetype \
            ffmpeg

          echo ""
          echo "=== CMake ==="
          cmake --version

          echo ""
          echo "=== Ninja ==="
          ninja --version


      # ==========================================================
      # 6. تجهيز Xcode و iOS SDK
      # ==========================================================
      - name: Setup Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          echo "=== Xcode ==="
          xcodebuild -version

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG_PATH="$(xcrun --sdk iphoneos --find clang)"
          CLANGXX_PATH="$(xcrun --sdk iphoneos --find clang++)"
          SWIFTC_PATH="$(xcrun --find swiftc)"

          if [ ! -d "$IOS_SDK" ]; then
            echo "ERROR: iPhoneOS SDK not found"
            exit 1
          fi

          echo "IOS_SDK=$IOS_SDK" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "CLANGXX_PATH=$CLANGXX_PATH" >> "$GITHUB_ENV"
          echo "SWIFTC_PATH=$SWIFTC_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "=== iOS Environment ==="
          echo "SDK: $IOS_SDK"
          echo "Clang: $CLANG_PATH"
          echo "Clang++: $CLANGXX_PATH"
          echo "Swift: $SWIFTC_PATH"

          echo ""
          "$SWIFTC_PATH" --version


      # ==========================================================
      # 7. تجهيز Homebrew
      # ==========================================================
      - name: Setup Homebrew Environment
        shell: bash
        run: |
          set -euo pipefail

          BREW_PREFIX="$(brew --prefix)"

          echo "BREW_PREFIX=$BREW_PREFIX" >> "$GITHUB_ENV"

          echo "CMAKE_PREFIX_PATH=$BREW_PREFIX" >> "$GITHUB_ENV"

          echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/share/pkgconfig" >> "$GITHUB_ENV"

          echo "SDL2_INCLUDE_DIR=$BREW_PREFIX/include" >> "$GITHUB_ENV"
          echo "SDL2_LIBRARY=$BREW_PREFIX/lib/libSDL2.dylib" >> "$GITHUB_ENV"

          echo "PATH=$BREW_PREFIX/bin:$PATH" >> "$GITHUB_ENV"

          echo ""
          echo "=== Homebrew ==="
          echo "Prefix: $BREW_PREFIX"


      # ==========================================================
      # 8. فحص CMake والمجلدات
      # ==========================================================
      - name: Check CMake Directories
        shell: bash
        run: |
          set -euo pipefail

          echo "=== add_subdirectory Entries ==="

          grep -Rni "add_subdirectory" \
            --include="CMakeLists.txt" \
            . \
            || true

          echo ""
          echo "=== ui_ios ==="

          if [ -d "Source/ui_ios" ]; then
            echo "Source/ui_ios found"
            find Source/ui_ios -maxdepth 3 -type f | head -100
          else
            echo "Source/ui_ios not found"
          fi

          echo ""
          echo "=== tools ==="

          if [ -d "tools" ]; then
            echo "tools found"
            find tools -maxdepth 2 -type d | head -100
          else
            echo "tools not found"
          fi

          echo ""
          echo "IMPORTANT: No project directories are deleted."


      # ==========================================================
      # 9. Configure CMake for iOS
      # ==========================================================
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          cd build

          echo "=================================="
          echo "Starting CMake configuration"
          echo "Target: arm64-apple-ios${MIN_IOS_VERSION}"
          echo "=================================="

          CMAKE_ARGS=(
            ..

            -G
            Ninja

            -DCMAKE_BUILD_TYPE=Release

            -DIOS=ON
            -DBUILD_IOS=ON
            -DTARGET_IOS=ON

            -DCMAKE_OSX_ARCHITECTURES=arm64
            -DCMAKE_OSX_SYSROOT=$IOS_SDK
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$MIN_IOS_VERSION

            -DCMAKE_PREFIX_PATH=$BREW_PREFIX

            -DCMAKE_C_COMPILER=$CLANG_PATH
            -DCMAKE_CXX_COMPILER=$CLANGXX_PATH
            -DCMAKE_Swift_COMPILER=$SWIFTC_PATH

            -DCMAKE_Swift_COMPILER_TARGET=arm64-apple-ios$MIN_IOS_VERSION
            -DCMAKE_Swift_FLAGS=-target\ arm64-apple-ios$MIN_IOS_VERSION

            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY

            -DCMAKE_C_FLAGS=-DGLES_SILENCE_DEPRECATION=1\ -Wno-deprecated-declarations\ -Wno-error=deprecated-declarations\ -Wno-error

            -DCMAKE_CXX_FLAGS=-DGLES_SILENCE_DEPRECATION=1\ -Wno-deprecated-declarations\ -Wno-error=deprecated-declarations\ -Wno-error

            -DCMAKE_OBJC_FLAGS=-DGLES_SILENCE_DEPRECATION=1\ -Wno-deprecated-declarations\ -Wno-error=deprecated-declarations\ -Wno-error

            -DCMAKE_OBJCXX_FLAGS=-DGLES_SILENCE_DEPRECATION=1\ -Wno-deprecated-declarations\ -Wno-error=deprecated-declarations\ -Wno-error

            -DUSE_QT=OFF
            -DENABLE_QT=OFF
            -DBUILD_QT=OFF
            -DBUILD_QT_UI=OFF

            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=TRUE
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE

            -DBUILD_TESTS=OFF
            -DBUILD_TESTING=OFF
            -DBUILD_EXAMPLES=OFF

            -DUSE_OPENGL=OFF
            -DUSE_OPENGLES=ON
            -DUSE_VULKAN=OFF

            -DUSE_LIBUSB=OFF
            -DUSE_BLUETOOTH=OFF
            -DUSE_DISCORD_RPC=OFF

            -DUSE_SDL2=ON
            -DSDL2_INCLUDE_DIR=$SDL2_INCLUDE_DIR
            -DSDL2_LIBRARY=$SDL2_LIBRARY
          )

          echo ""
          echo "=== CMake Arguments ==="

          printf '%s\n' "${CMAKE_ARGS[@]}"

          echo ""
          echo "=== Running CMake ==="

          cmake "${CMAKE_ARGS[@]}"

          echo ""
          echo "Configure completed successfully"


      # ==========================================================
      # 10. فحص إعدادات CMake
      # ==========================================================
      - name: Check CMake Cache
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "build/CMakeCache.txt" ]; then
            echo "ERROR: CMakeCache.txt not found"
            exit 1
          fi

          echo "=== Important CMake Settings ==="

          grep -Ei \
            "CMAKE_SYSTEM_NAME|CMAKE_OSX_ARCHITECTURES|CMAKE_OSX_SYSROOT|CMAKE_OSX_DEPLOYMENT_TARGET|CMAKE_Swift|IOS|GLES" \
            build/CMakeCache.txt \
            || true


      # ==========================================================
      # 11. فحص Swift Target
      # ==========================================================
      - name: Check Swift iOS Target
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Swift Target Test ==="

          "$SWIFTC_PATH" \
            -target "arm64-apple-ios${MIN_IOS_VERSION}" \
            -sdk "$IOS_SDK" \
            -print-target-info

          echo ""
          echo "Swift iOS target is valid"


      # ==========================================================
      # 12. بدء البناء
      # ==========================================================
      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          CPU_COUNT="$(sysctl -n hw.ncpu)"

          echo "=================================="
          echo "Starting Build"
          echo "CPU Count: $CPU_COUNT"
          echo "GLES_SILENCE_DEPRECATION: $GLES_SILENCE_DEPRECATION"
          echo "=================================="

          export GLES_SILENCE_DEPRECATION=1

          cmake --build build \
            --parallel "$CPU_COUNT" \
            --verbose

          echo ""
          echo "Build completed successfully"


      # ==========================================================
      # 13. البحث عن التطبيق
      # ==========================================================
      - name: Find Application
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Searching for .app ==="

          find build -type d -name "*.app" -print || true

          APP_PATH="$(find build -type d -name "*.app" -print | head -n 1 || true)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was found"

            echo ""
            echo "=== Build Output ==="

            find build -maxdepth 6 -print | head -500 || true

            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "Application found:"
          echo "$APP_PATH"


      # ==========================================================
      # 14. فحص التطبيق
      # ==========================================================
      - name: Verify Application
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Application Files ==="

          find "$APP_PATH" -maxdepth 3 -print | head -200

          echo ""

          if [ -f "$APP_PATH/Info.plist" ]; then
            echo "Info.plist found"
          else
            echo "WARNING: Info.plist not found"
          fi


      # ==========================================================
      # 15. إنشاء IPA
      # ==========================================================
      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Payload
          rm -f Play.ipa

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          echo "=== Payload Contents ==="

          find Payload -maxdepth 3 -print | head -100

          echo ""
          echo "Creating Play.ipa..."

          zip -qry Play.ipa Payload

          if [ ! -f "Play.ipa" ]; then
            echo "ERROR: IPA creation failed"
            exit 1
          fi

          echo ""
          echo "IPA created successfully:"
          ls -lh Play.ipa


      # ==========================================================
      # 16. فحص IPA
      # ==========================================================
      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "=== IPA Contents ==="

          unzip -l Play.ipa | head -100

          if ! unzip -l Play.ipa | grep -q "Payload/"; then
            echo "ERROR: Invalid IPA structure"
            exit 1
          fi

          if ! unzip -l Play.ipa | grep -q "\.app"; then
            echo "ERROR: No .app found inside IPA"
            exit 1
          fi

          echo ""
          echo "IPA verification completed successfully"


      # ==========================================================
      # 17. رفع IPA
      # ==========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Play-iOS-IPA
          path: Play.ipa
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 18. رفع ملفات التشخيص إذا فشل البناء
      # ==========================================================
      - name: Upload Build Debug Files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Debug
          path: |
            build/CMakeCache.txt
            build/CMakeFiles
            build/build.ninja
            build/*.log
          if-no-files-found: ignore
          retention-days: 7
