name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:

      # ==========================================================
      # 1. تحميل المشروع
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # ==========================================================
      # 2. تحديث Submodules
      # ==========================================================
      - name: Update Submodules
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "Submodules updated"


      # ==========================================================
      # 3. تنظيف
      # ==========================================================
      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          rm -rf Payload
          rm -f Play.ipa

          echo "Clean completed"


      # ==========================================================
      # 4. فحص المشروع
      # ==========================================================
      - name: Check Project
        shell: bash
        run: |
          set -euo pipefail

          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          if [ ! -f CMakeLists.txt ]; then
            echo "ERROR: CMakeLists.txt not found"
            exit 1
          fi

          echo "CMakeLists.txt found"

          echo "Tools directories:"

          if [ -d tools ]; then
            find tools -maxdepth 2 -type d | head -100
          else
            echo "WARNING: tools directory does not exist"
          fi


      # ==========================================================
      # 5. تثبيت الأدوات
      # ==========================================================
      - name: Install Build Tools
        shell: bash
        run: |
          set -euo pipefail

          brew update

          brew install cmake ninja pkg-config

          brew install \
            sdl2 \
            glew \
            glm \
            libpng \
            zlib \
            libogg \
            libvorbis \
            freetype \
            ffmpeg

          echo "Tools installed"

          cmake --version
          ninja --version


      # ==========================================================
      # 6. تجهيز iOS SDK
      # ==========================================================
      - name: Setup iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          if [ ! -d "$IOS_SDK" ]; then
            echo "ERROR: iOS SDK not found"
            exit 1
          fi

          CLANG_PATH=$(xcrun --sdk iphoneos --find clang)
          CLANGXX_PATH=$(xcrun --sdk iphoneos --find clang++)

          echo "IOS_SDK=$IOS_SDK" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "CLANGXX_PATH=$CLANGXX_PATH" >> "$GITHUB_ENV"

          echo "iOS SDK:"
          echo "$IOS_SDK"

          echo "Clang:"
          echo "$CLANG_PATH"

          echo "Clang++:"
          echo "$CLANGXX_PATH"


      # ==========================================================
      # 7. تجهيز Homebrew
      # ==========================================================
      - name: Setup Homebrew Environment
        shell: bash
        run: |
          set -euo pipefail

          BREW_PREFIX=$(brew --prefix)

          echo "BREW_PREFIX=$BREW_PREFIX" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$BREW_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/share/pkgconfig" >> "$GITHUB_ENV"

          echo "BREW_PREFIX:"
          echo "$BREW_PREFIX"


      # ==========================================================
      # 8. فحص add_subdirectory
      # لا نحذف tools
      # ==========================================================
      - name: Check CMake Directories
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking add_subdirectory entries"

          grep -n "add_subdirectory" CMakeLists.txt || true

          echo "Checking required tools"

          REQUIRED_DIRS=(
            "tools/ElfView"
            "tools/DiscChecker"
            "tools/NamcoSys147NANDTools"
          )

          for DIR in "${REQUIRED_DIRS[@]}"; do
            if [ -d "$DIR" ]; then
              echo "Found: $DIR"
            else
              echo "WARNING: Missing directory: $DIR"
            fi
          done


      # ==========================================================
      # 9. CMake Configure
      # ==========================================================
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          cd build

          echo "Starting CMake"

          CMAKE_ARGS=(
            ..
            -G
            Ninja

            -DCMAKE_BUILD_TYPE=Release

            -DIOS=ON
            -DBUILD_IOS=ON
            -DTARGET_IOS=ON

            -DCMAKE_OSX_ARCHITECTURES=arm64
            -DCMAKE_OSX_SYSROOT=$IOS_SDK
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

            -DCMAKE_PREFIX_PATH=$BREW_PREFIX

            -DCMAKE_C_COMPILER=$CLANG_PATH
            -DCMAKE_CXX_COMPILER=$CLANGXX_PATH

            -DUSE_QT=OFF
            -DENABLE_QT=OFF
            -DBUILD_QT=OFF
            -DBUILD_QT_UI=OFF
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=TRUE
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE

            -DBUILD_TESTS=OFF
            -DBUILD_TESTING=OFF
            -DBUILD_EXAMPLES=OFF

            -DUSE_OPENGL=OFF
            -DUSE_OPENGLES=ON
            -DUSE_VULKAN=OFF

            -DUSE_LIBUSB=OFF
            -DUSE_BLUETOOTH=OFF
            -DUSE_DISCORD_RPC=OFF

            -DUSE_SDL2=ON
          )

          echo "CMake arguments:"

          printf '%s\n' "${CMAKE_ARGS[@]}"

          cmake "${CMAKE_ARGS[@]}"

          echo "Configure completed"


      # ==========================================================
      # 10. فحص Cache
      # ==========================================================
      - name: Check CMake Cache
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f build/CMakeCache.txt ]; then
            echo "ERROR: CMakeCache.txt not found"
            exit 1
          fi

          echo "CMake configured successfully"

          grep -E "IOS|Qt|CMAKE_OSX" build/CMakeCache.txt || true


      # ==========================================================
      # 11. البناء
      # ==========================================================
      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          CPU_COUNT=$(sysctl -n hw.ncpu)

          echo "CPU count: $CPU_COUNT"

          cmake --build build --parallel "$CPU_COUNT"

          echo "Build completed"


      # ==========================================================
      # 12. البحث عن التطبيق
      # ==========================================================
      - name: Find App
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find build -type d -name "*.app" -print | head -n 1 || true)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"

            echo "Build files:"

            find build -maxdepth 5 -print | head -200 || true

            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "Application found:"
          echo "$APP_PATH"


      # ==========================================================
      # 13. إنشاء IPA
      # ==========================================================
      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Payload
          rm -f Play.ipa

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          zip -r Play.ipa Payload

          if [ ! -f Play.ipa ]; then
            echo "ERROR: IPA creation failed"
            exit 1
          fi

          ls -lh Play.ipa


      # ==========================================================
      # 14. فحص IPA
      # ==========================================================
      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          unzip -l Play.ipa | head -100

          if ! unzip -l Play.ipa | grep -q "Payload/"; then
            echo "ERROR: Invalid IPA structure"
            exit 1
          fi

          echo "IPA verified"


      # ==========================================================
      # 15. رفع IPA
      # ==========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Play-iOS-IPA
          path: Play.ipa
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 16. رفع سجلات الخطأ
      # ==========================================================
      - name: Upload Debug Files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Debug
          path: |
            build/CMakeCache.txt
            build/CMakeFiles
          if-no-files-found: ignore
          retention-days: 7
